<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Lamya's Group | تعليمات المرضى · Patient Instructions</title>
<meta name="description" content="Dr. Lamya's Group dental care instructions — before and after your treatment. تعليمات العناية بالأسنان قبل وبعد العلاج.">
<meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Dr. Lamya's Group — Patient Instructions">
<meta property="og:description" content="تعليمات العناية بالأسنان قبل وبعد العلاج · Dental care instructions">
<meta property="og:image" content="https://drlamyas.github.io/logo.png">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function(){
    var t=null,l=null;
    try{t=localStorage.getItem('theme');l=localStorage.getItem('lang')}catch(e){}
    if(!t) t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    var q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='ar')l=q;
    if(!l)l='ar';
    var h=document.documentElement;h.dataset.theme=t;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';
  })();
</script>
<style>
  :root{
    --pink:#E71E6C; --pink-soft:#FDE8F0; --blue:#1E95BC; --blue-soft:#E8F6FB;
    --ink:#2B2B2B; --muted:#7A7A7A; --line:#ECECEC; --bg:#FAFAFB; --card:#FFFFFF;
    --chev:#C4C4C4; --hover-border:#F6C3D7; --shadow:rgba(231,30,108,.10);
  }
  [data-theme="dark"]{
    --pink:#FF4D8D; --pink-soft:rgba(255,77,141,.14); --blue:#5CC6E8; --blue-soft:rgba(92,198,232,.14);
    --ink:#F2F2F4; --muted:#9A9AA2; --line:#2A2A2F; --bg:#121214; --card:#1B1B1F;
    --chev:#55555C; --hover-border:#5A2A3D; --shadow:rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg);transition:background .2s}
  body{font-family:"Tajawal","Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);
       min-height:100vh;display:flex;justify-content:center;padding:16px 16px 40px;-webkit-font-smoothing:antialiased;
       transition:background .2s,color .2s}
  html[lang="en"] body{font-family:"Inter","Tajawal",system-ui,sans-serif}
  .wrap{width:100%;max-width:520px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;
       border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
       font:600 13px "Inter","Tajawal",sans-serif;transition:border-color .15s}
  .btn:hover{border-color:var(--hover-border)}
  .btn.icon-only{width:38px;padding:0;justify-content:center}
  .btn svg{width:18px;height:18px}
  .sun{display:none}
  [data-theme="dark"] .sun{display:block}
  [data-theme="dark"] .moon{display:none}
  header{text-align:center;margin-bottom:22px}
  .logo{width:190px;height:auto;display:block;margin:0 auto 14px}
  [data-theme="dark"] .logo{filter:brightness(1.15)}
  h1{font-size:22px;font-weight:700;line-height:1.4}
  .sub{font-size:14px;color:var(--muted);margin-top:4px}
  .section{font-size:12px;font-weight:600;color:var(--muted);margin:22px 4px 10px;letter-spacing:.4px}
  html[lang="en"] .section{text-transform:uppercase;font-size:11px}
  a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;
         padding:16px;margin-bottom:10px;text-decoration:none;color:inherit;
         transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .2s}
  a.card:hover{transform:translateY(-1px);box-shadow:0 6px 18px var(--shadow);border-color:var(--hover-border)}
  a.card:active{transform:scale(.99)}
  .icon{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--pink-soft);color:var(--pink)}
  .card.pre .icon{background:var(--blue-soft);color:var(--blue)}
  .icon svg{width:24px;height:24px}
  .txt{flex:1;min-width:0}
  .main{font-size:17px;font-weight:700;line-height:1.35}
  html[lang="en"] .main{font-family:"Inter",sans-serif;font-size:16px;font-weight:600}
  .alt{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
  html[lang="ar"] .alt{font-family:"Inter",sans-serif;direction:ltr;text-align:right}
  html[lang="en"] .alt{font-family:"Tajawal",sans-serif;font-size:14px;direction:rtl;text-align:left}
  html[lang] h1 .alt{display:block;font-size:14px;font-weight:500;text-align:center;margin-top:2px}
  .section{display:flex;justify-content:space-between;align-items:baseline}
  .section .alt{font-size:11px;margin:0}
  .go{flex:none;color:var(--chev)}
  .go svg{width:20px;height:20px}
  html[dir="rtl"] .go svg{transform:scaleX(-1)}
  .contact{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;transition:background .2s}
  .contact a{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
  .contact a:last-child{border-bottom:none}
  .contact .b{font-weight:700;font-size:15px}
  html[lang="en"] .contact .b{font-weight:600;font-size:14.5px;font-family:"Inter",sans-serif}
  .contact .b small{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:8px}
  html[lang="ar"] .contact .b small{font-family:"Inter",sans-serif}
  html[lang="en"] .contact .b small{font-family:"Tajawal",sans-serif;font-size:13px}
  .contact .p{font-family:"Inter",sans-serif;direction:ltr;color:var(--pink);font-weight:600;font-size:14px}
  footer{text-align:center;margin-top:26px;font-size:12px;color:var(--muted);line-height:1.9;font-family:"Inter",sans-serif}
  footer a{color:var(--pink);text-decoration:none}
  footer .tag{letter-spacing:.6px}
</style>
</head>
<body>
<main class="wrap">
  <div class="bar">
    <button class="btn" id="langBtn" type="button" aria-label="Switch language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <span id="langLabel">English</span>
    </button>
    <button class="btn icon-only" id="themeBtn" type="button" aria-label="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <header>
    <img class="logo" src="logo.png" alt="Dr. Lamya's Group">
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="subtitle"></p>
  </header>
  <div class="section" data-i18n="before"></div>
  <div id="beforeList"></div>
  <div class="section" data-i18n="after"></div>
  <div id="afterList"></div>
  <div class="section" data-i18n="contact"></div>
  <div class="contact" id="contactList"></div>
  <footer>
    <div class="tag">Ultimate Dental Excellence</div>
    <a href="https://www.drlamyas.net" target="_blank" rel="noopener">www.drlamyas.net</a>
  </footer>
</main>
<script>
  var T = {
    ar:{title:"تعليمات العناية للمرضى",subtitle:"اختر نوع العلاج لعرض التعليمات",before:"قبل العلاج",after:"بعد العلاج",contact:"تواصل معنا",switchTo:"English"},
    en:{title:"Patient Care Instructions",subtitle:"Choose your treatment to view the instructions",before:"Before treatment",after:"After treatment",contact:"Contact us",switchTo:"العربية"}
  };
  var TOOTH='<path d="M7 3c-2.2 0-4 1.8-4 4.3 0 2.4 1.2 4 1.8 6.5.6 2.6.8 7.2 2.6 7.2 1.6 0 1.6-5 4.6-5s3 5 4.6 5c1.8 0 2-4.6 2.6-7.2.6-2.5 1.8-4.1 1.8-6.5C21 4.8 19.2 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/>';
  var ICONS={
    check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    tooth:TOOTH,
    canal:TOOTH+'<path d="M12 8v6"/>',
    filling:TOOTH+'<circle cx="12" cy="9" r="2.2" fill="currentColor" stroke="none"/>',
    sparkle:'<path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
    laser:'<path d="M4 20L14 10"/><path d="M14 10l6-6"/><circle cx="14" cy="10" r="2.5"/><path d="M17 13l2 1M11 7l-1-2M17 7l2-1"/>'
  };
  var BEFORE=[
    {file:"pre-extraction",icon:"check",ar:"تعليمات قبل خلع الأسنان",en:"Pre-extraction instructions",pre:true}
  ];
  var AFTER=[
    {file:"post-extraction",icon:"tooth",ar:"تعليمات بعد خلع الأسنان",en:"Post-extraction instructions"},
    {file:"post-root-canal",icon:"canal",ar:"تعليمات بعد علاج العصب",en:"Post root canal instructions"},
    {file:"post-filling",icon:"filling",ar:"تعليمات بعد حشوات الأسنان",en:"Post dental filling instructions"},
    {file:"post-laser-whitening",icon:"sparkle",ar:"تعليمات بعد التبييض بالليزر",en:"Post laser whitening instructions"},
    {file:"post-laser-treatment",icon:"laser",ar:"تعليمات بعد علاج الليزر",en:"Post laser treatment instructions"}
  ];
  var BRANCHES=[
    {ar:"المحرق",en:"Muharraq",tel:"+97317324455",show:"+973 1732 4455"},
    {ar:"الرفاع",en:"Riffa",tel:"+97317340005",show:"+973 1734 0005"},
    {ar:"الجنبية",en:"Janabiya",tel:"+97317697700",show:"+973 1769 7700"},
    {ar:"ديار المحرق",en:"Diyar",tel:"+97317320022",show:"+973 1732 0022"},
    {ar:"INH",en:"INH",tel:"+97317828205",show:"+973 1782 8205"}
  ];
  function card(i,l){
    return '<a class="card'+(i.pre?' pre':'')+'" href="pdf/'+i.file+'.pdf" target="_blank" rel="noopener">'+
      '<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[i.icon]+'</svg></div>'+
      '<div class="txt"><div class="main">'+i[l]+'</div><div class="alt">'+i[l==='ar'?'en':'ar']+'</div></div>'+
      '<div class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div></a>';
  }
  function render(){
    var l=document.documentElement.lang==='en'?'en':'ar';
    var o=l==='ar'?'en':'ar';
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k=el.dataset.i18n;
      el.innerHTML=(el.tagName==='H1'||el.classList.contains('section'))
        ? '<span>'+T[l][k]+'</span><span class="alt">'+T[o][k]+'</span>' : T[l][k];
    });
    document.getElementById('langLabel').textContent=T[l].switchTo;
    document.getElementById('beforeList').innerHTML=BEFORE.map(function(i){return card(i,l)}).join('');
    document.getElementById('afterList').innerHTML=AFTER.map(function(i){return card(i,l)}).join('');
    document.getElementById('contactList').innerHTML=BRANCHES.map(function(b){
      var o=l==='ar'?'en':'ar', sub=b[o]!==b[l]?'<small>'+b[o]+'</small>':'';
      return '<a href="tel:'+b.tel+'"><span class="b">'+b[l]+sub+'</span><span class="p">'+b.show+'</span></a>';
    }).join('');
  }
  function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  document.getElementById('langBtn').onclick=function(){
    var h=document.documentElement,l=h.lang==='ar'?'en':'ar';
    h.lang=l;h.dir=l==='ar'?'rtl':'ltr';save('lang',l);render();
  };
  document.getElementById('themeBtn').onclick=function(){
    var h=document.documentElement,t=h.dataset.theme==='dark'?'light':'dark';
    h.dataset.theme=t;save('theme',t);
  };
  render();
</script>
</body>
</html>
